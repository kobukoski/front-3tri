
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f7f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .formulario::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: url("escudo-coritiba.png");
    background-size: 85%;
    background-position: center;
    background-repeat: no-repeat;
    opacity: 0.15;
    pointer-events: none;
    z-index: 0;
}

        /* Escudo como marca-d'água */
        .formulario::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: url("escudo-coritiba.png");
            background-size: 85%;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.07;
            pointer-events: none;
            z-index: 0;
        }

        .formulario > * {
            position: relative;
            z-index: 1;
        }

        h2 {
            text-align: center;
            color: #006b4f;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            margin-top: 15px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            background-color: rgba(255,255,255,0.85);
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            background-color: #006b4f;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #004d39;
        }
    </style>
</head>

<body>

    <form class="formulario">
        <h2>Meu Formulário</h2>

        <label for="nome">Nome</label>
        <input type="text" id="nome" placeholder="Digite seu nome">

        <label for="sobrenome">Sobrenome</label>
        <input type="text" id="sobrenome" placeholder="Digite seu sobrenome">

        <label for="conta">Conta</label>
        <input type="email" id="conta" placeholder="Digite seu e-mail">

        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="Digite sua senha">

        <label for="nascimento">Data de nascimento</label>
        <input type="date" id="nascimento">

        <label for="idade">Idade</label>
        <input type="number" id="idade" placeholder="Digite sua idade">

        <label for="cep">CEP</label>
        <input type="text" id="cep" placeholder="00000-000">

        <label for="cpf">CPF</label>
        <input type="text" id="cpf" placeholder="000.000.000-00">

        <button type="button">Cadastrar</button>
    </form>

    <script>
        window.addEventListener("load", function() {
            document.querySelector(".formulario").reset();
        });
    </script>

</body>
</html>
